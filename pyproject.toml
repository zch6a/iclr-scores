[project]
name = "iclr-scores"
version = "0.1.0"
description = "What ICLR's review scores led to, year by year (2017-2025): the acceptance rate by mean score, where half the papers were accepted, disagreement, withdrawals, topics, and the odds for a set of scores. A static site and a command, from the public ICLR dataset."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["research", "peer-review", "iclr", "openreview", "acceptance", "statistics", "static-site"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
build = ["pyarrow>=14"]  # reading the dataset's Parquet file: only `iclr-scores build` needs it

[project.urls]
Homepage = "https://github.com/zch6a/iclr-scores"
Site = "https://zch6a.github.io/iclr-scores/"
Issues = "https://github.com/zch6a/iclr-scores/issues"

[project.scripts]
iclr-scores = "iclr_scores.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iclr_scores"]

[tool.hatch.build.targets.wheel.force-include]  # the page, so `iclr-scores build` writes a whole site
"site/index.html" = "iclr_scores/site/index.html"
"site/app.js" = "iclr_scores/site/app.js"
"site/style.css" = "iclr_scores/site/style.css"

[tool.hatch.build.targets.sdist]
exclude = ["docs/", "site/data/"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
files = ["src/iclr_scores"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter wraps the code; messages and docs stay whole
