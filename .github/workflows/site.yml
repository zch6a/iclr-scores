name: Site
# On a push to main and by hand: compute the statistics and publish the site on GitHub Pages. The data is one pinned
# file (iclr_scores/data.py), so a new version of the dataset is a change of code, and builds in between are the same.
# - The build job runs the tool with a read-only token; it downloads the pinned file, checks its size and SHA-256,
#   reads it and deletes it.
# - The deploy job runs nothing of the project: it publishes the artifact the build uploaded.
# Actions pinned to commits.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: site
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; it has no moving major tag
      - run: uv run --locked --extra build iclr-scores build --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
